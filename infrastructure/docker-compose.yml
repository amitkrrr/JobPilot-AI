version: '3.8'

services:

  postgres:
    image: postgres:16-alpine
    container_name: jobpilot-postgres

    environment:
      POSTGRES_DB: jobpilot
      POSTGRES_USER: jobpilot
      POSTGRES_PASSWORD: jobpilot

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped


  minio:
    image: quay.io/minio/aistor/minio:RELEASE.2026-09-07T08-39-31Z

    container_name: jobpilot-minio

    environment:
      MINIO_ROOT_USER: jobpilot-access-key
      MINIO_ROOT_PASSWORD: jobpilot-secret-key

    ports:
      - "9000:9000"
      - "9001:9001"

    command: server /data --console-address ":9001" --license /minio.license

    volumes:
      - minio_data:/data
      - ./minio.license:/minio.license:ro

    restart: unless-stopped


  redis:
    image: redis:7-alpine
    container_name: jobpilot-redis

    ports:
      - "6379:6379"

    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru

    restart: unless-stopped


  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: jobpilot-zookeeper

    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

    restart: unless-stopped


  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: jobpilot-kafka

    depends_on:
      - zookeeper

    ports:
      - "9092:9092"

    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    restart: unless-stopped


volumes:
  postgres_data:
  minio_data:
