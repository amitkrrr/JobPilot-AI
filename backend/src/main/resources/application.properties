spring.application.name=backend

# Active profile — override with SPRING_PROFILES_ACTIVE env var in CI/production
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
spring.datasource.url=jdbc:postgresql://localhost:5432/jobpilot
spring.datasource.username=jobpilot
spring.datasource.password=jobpilot
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

jwt.secret=jobpilot-super-secret-key-change-this-before-production-123456
jwt.expiration=3600000

# S3 / MinIO Storage Configuration
aws.s3.endpoint=http://localhost:9000
aws.s3.access-key=jobpilot-access-key
aws.s3.secret-key=jobpilot-secret-key
aws.s3.region=us-east-1
aws.s3.bucket-name=jobpilot-resumes

# AI Service
ai.service.url=http://localhost:8000

# Job Source Connectors
# Keys are read from environment variables (CI/prod) or from
# application-local.properties for local development (git-ignored).
#
# To configure locally:
#   1. Copy application-local.properties and fill in your keys.
#   2. Run:  ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
#
# Adzuna — free tier 250 req/month: https://developer.adzuna.com
adzuna.app-id=${ADZUNA_APP_ID:}
adzuna.app-key=${ADZUNA_APP_KEY:}

# Jooble — free tier: https://jooble.org/api/about
jooble.api-key=${JOOBLE_API_KEY:}
